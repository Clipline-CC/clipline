[package]
name = "clipline-games"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clipline-settings = { path = "../clipline-settings" }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
clipline-capture = { path = "../clipline-capture" }
png = "0.17"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
clipline-test-utils = { path = "../clipline-test-utils" }
clipline-events = { path = "../clipline-events" }
