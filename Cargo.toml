[workspace]
resolver = "2"
members = [
    "crates/clipline-events",
    "crates/clipline-lol",
    "crates/clipline-buffer",
    "crates/clipline-storage",
    "crates/clipline-capture",
    "crates/clipline-desktop",
    "crates/clipline-shell",
    "crates/clipline-updater",
    "crates/clipline-mp4",
    "crates/clipline-playback",
    "crates/clipline-test-utils",
    "apps/clipline-app",
]
exclude = ["third-party/shiguredo_opus", "apps/clipline-slint-spike"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shiguredo_opus = { path = "third-party/shiguredo_opus", version = "=2026.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
httpmock = "0.7"
semver = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }

[patch.crates-io]
# wayland-scanner 0.31.10's published quick-xml 0.39 dependency is affected by
# RUSTSEC-2026-0194/0195. Upstream has the 0.41 fix but has not released it yet.
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs", rev = "a55c54b4e138e29181d63908ece06fd2a13550a0" }

[profile.release]
# Keep private symbols so release panic backtraces can be resolved from the
# access-controlled CI artifact. Symbols are not bundled with the installer.
debug = 1

# Optimized build used only by the matched frontend benchmark harness. Keeping
# debug assertions enabled is a safety property: Clipline deliberately skips
# autostart-registry mutation when `cfg!(debug_assertions)` is true.
[profile.benchmark]
inherits = "release"
debug-assertions = true
