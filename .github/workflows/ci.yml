name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (stable toolchain)
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Real-demuxer validation for the MP4 tests (they self-skip without it).
      # Cap apt at 5 minutes: GitHub Ubuntu mirrors can hang on `apt-get update`
      # with no default step timeout, which blocked main CI for over an hour on
      # the 1.0.0 push.
      - name: Install ffprobe
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # Some GitHub runners cannot reach azure.archive.ubuntu.com; the
          # primary archive mirror works on all of them. Redirect before
          # update so a dead regional mirror cannot eat the 5-minute cap.
          sudo find /etc/apt/sources.list /etc/apt/sources.list.d -type f \
            -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
