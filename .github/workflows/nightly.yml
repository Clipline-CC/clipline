name: Nightly Release

on:
  push:
    tags:
      - "nightly-v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: clipline-nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      already_published: ${{ steps.release_state.outputs.already_published }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (stable toolchain)
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Validate tag, version, and develop ancestry
        shell: pwsh
        run: |
          .\scripts\prepare-nightly-assets.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -Commit $env:GITHUB_SHA `
            -ValidateOnly
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge-base --is-ancestor $env:GITHUB_SHA origin/develop
          if ($LASTEXITCODE -ne 0) {
            throw "Nightly tags must point at a commit contained in develop."
          }

      - name: Reject version regressions
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "already_published=false" >> $env:GITHUB_OUTPUT
          $releaseJson = gh release view nightly --json targetCommitish 2>$null
          if ($LASTEXITCODE -ne 0) { exit 0 }
          $release = $releaseJson | ConvertFrom-Json
          New-Item -ItemType Directory -Path current-nightly | Out-Null
          gh release download nightly --pattern latest.json --dir current-nightly
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the current Nightly manifest." }
          $current = Get-Content current-nightly/latest.json -Raw | ConvertFrom-Json
          $next = Get-Content apps/clipline-app/tauri.conf.json -Raw | ConvertFrom-Json
          if ($release.targetCommitish -eq $env:GITHUB_SHA -and $current.version -eq $next.version) {
            "already_published=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ([version]$current.version -ge [version]$next.version) {
            throw "Nightly version $($next.version) must be newer than published version $($current.version)."
          }

      - name: Test
        if: steps.release_state.outputs.already_published != 'true'
        run: cargo test --workspace

      - name: Clippy
        if: steps.release_state.outputs.already_published != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install pinned Tauri CLI
        if: steps.release_state.outputs.already_published != 'true'
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Verify reviewed WebView2 configuration
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: .\scripts\verify-webview2-runtime.ps1

      - name: Build and preserve regular installer
        if: steps.release_state.outputs.already_published != 'true'
        working-directory: apps/clipline-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLIPLINE_BUG_REPORT_ENDPOINT: https://support.dain.cafe/api/v1/reports
        run: cargo tauri build

      - name: Preserve regular updater assets
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $version = (Get-Content apps/clipline-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "Clipline_${version}_x64-setup.exe"
          $source = Join-Path target/release/bundle/nsis $name
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path dist $name)
          Copy-Item -LiteralPath "$source.sig" -Destination (Join-Path dist "$name.sig")

      - name: Stage standalone runtimes
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          .\scripts\stage-webview2-runtime.ps1
          $manifest = Get-Content apps/clipline-app/ffmpeg-runtime.json -Raw | ConvertFrom-Json
          $inputRoot = Join-Path $env:RUNNER_TEMP 'clipline-ffmpeg-inputs'
          New-Item -ItemType Directory -Path $inputRoot -Force | Out-Null
          $archive = Join-Path $inputRoot $manifest.archive_name
          Invoke-WebRequest -UseBasicParsing -Uri $manifest.archive_url -OutFile $archive
          .\scripts\stage-ffmpeg-resource.ps1 -ArchivePath $archive
          .\scripts\verify-ffmpeg-resource.ps1

      - name: Build standalone installer
        if: steps.release_state.outputs.already_published != 'true'
        working-directory: apps/clipline-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLIPLINE_BUG_REPORT_ENDPOINT: https://support.dain.cafe/api/v1/reports
        run: cargo tauri build --config tauri.standalone.conf.json

      - name: Rename and re-sign standalone installer
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content apps/clipline-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $source = "target/release/bundle/nsis/Clipline_${version}_x64-setup.exe"
          $standalone = "dist/Clipline_${version}_x64-standalone-setup.exe"
          Copy-Item -LiteralPath $source -Destination $standalone
          cargo tauri signer sign -p "" $standalone

      - name: Generate release notes and updater manifests
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $generated = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
            -f tag_name=$env:GITHUB_REF_NAME `
            -f previous_tag_name=nightly `
            -f target_commitish=$env:GITHUB_SHA
          $notes = if ($LASTEXITCODE -eq 0) { ($generated | ConvertFrom-Json).body } else { $null }
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Automated Nightly build from the latest develop changes."
          }
          # Optional generate-notes is best-effort under contents:read. Clear the native
          # status so a successful prepare-nightly-assets.ps1 is not poisoned by gh.
          $global:LASTEXITCODE = 0
          [System.IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'nightly-notes.md'),
            "$notes`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          .\scripts\prepare-nightly-assets.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -Commit $env:GITHUB_SHA `
            -Repository $env:GITHUB_REPOSITORY `
            -ReleaseDirectory dist `
            -NotesPath (Join-Path $env:RUNNER_TEMP 'nightly-notes.md')

      - name: Upload verified release transaction
        if: steps.release_state.outputs.already_published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clipline-nightly-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.already_published != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_TAG: nightly-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: clipline-nightly-${{ github.sha }}
          path: dist

      - name: Upload complete draft release
        shell: pwsh
        run: |
          $latest = Get-Content dist/latest.json -Raw | ConvertFrom-Json
          $notes = Get-ChildItem -LiteralPath dist -Filter 'release-notes-*.md' -File -ErrorAction Stop
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($assets.Count -ne 7) { throw "Expected seven staged Nightly assets." }
          gh release create $env:STAGING_TAG @assets `
            --draft `
            --prerelease `
            --latest=false `
            --target $env:GITHUB_SHA `
            --title "Clipline Nightly $($latest.version)" `
            --notes-file $notes.FullName

      - name: Verify draft and promote rolling Nightly
        shell: pwsh
        run: |
          $draft = gh release view $env:STAGING_TAG `
            --json assets,isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          $expected = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object Name | Sort-Object)
          $actual = @($draft.assets | ForEach-Object name | Sort-Object)
          if (-not $draft.isDraft -or -not $draft.isPrerelease) {
            throw "Staging release must remain a draft prerelease until promotion."
          }
          if (@(Compare-Object $expected $actual).Count -ne 0) {
            throw "Staging release asset set does not match the verified build output."
          }

          gh release view nightly *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete nightly --cleanup-tag --yes
          }
          gh release edit $env:STAGING_TAG `
            --tag nightly `
            --target $env:GITHUB_SHA `
            --draft=false `
            --prerelease `
            --latest=false

      - name: Verify public release bytes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path downloaded | Out-Null
          gh release download nightly --dir downloaded
          $expected = @(Get-ChildItem -LiteralPath dist -File | Sort-Object Name)
          $actual = @(Get-ChildItem -LiteralPath downloaded -File | Sort-Object Name)
          if ($expected.Count -ne 7 -or $actual.Count -ne 7) {
            throw "Published Nightly must contain exactly seven assets."
          }
          for ($index = 0; $index -lt $expected.Count; $index++) {
            if ($expected[$index].Name -cne $actual[$index].Name) {
              throw "Published Nightly asset names do not match staged assets."
            }
            $stagedHash = (Get-FileHash -LiteralPath $expected[$index].FullName -Algorithm SHA256).Hash
            $publicHash = (Get-FileHash -LiteralPath $actual[$index].FullName -Algorithm SHA256).Hash
            if ($stagedHash -cne $publicHash) {
              throw "Published Nightly asset differs from staged bytes: $($expected[$index].Name)."
            }
          }
          $release = gh release view nightly `
            --json isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($release.isDraft -or -not $release.isPrerelease -or $release.targetCommitish -cne $env:GITHUB_SHA) {
            throw "Published Nightly metadata does not match the tagged commit."
          }
