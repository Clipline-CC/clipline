[package]
name = "clipline-slint-spike"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
package-regular = []
package-standalone = []

[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clipline-slint-spike"
path = "src/main.rs"

[dependencies]
clipline-desktop = { path = "../../crates/clipline-desktop" }
clipline-library = { path = "../../crates/clipline-library" }
clipline-shell = { path = "../../crates/clipline-shell" }
clipline-mp4 = { path = "../../crates/clipline-mp4" }
clipline-playback = { path = "../../crates/clipline-playback" }
clipline-settings = { path = "../../crates/clipline-settings" }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "raw-window-handle-06",
    "renderer-software",
    "std",
    "system-tray",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
serde_json = "1"
slint-build = "=1.17.1"

[dev-dependencies]
clipline-test-utils = { path = "../../crates/clipline-test-utils" }


[profile.benchmark]
inherits = "release"
debug-assertions = true
