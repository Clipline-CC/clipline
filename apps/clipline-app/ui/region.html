<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clipline Region</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    #region-overlay { position: fixed; inset: 0; cursor: crosshair; user-select: none; }
    #region-overlay-frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    #region-selection {
      position: absolute; display: none;
      border: 1px solid #4c9aff;
      box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.35);
    }
    #region-readout {
      position: absolute; display: none; padding: 2px 8px;
      background: rgba(20, 20, 20, 0.85); color: #fff;
      font: 13px/1.4 system-ui, sans-serif; border-radius: 3px; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="region-overlay">
    <img id="region-overlay-frame" alt="" draggable="false" />
    <div id="region-selection"></div>
    <div id="region-readout"></div>
  </div>
  <script src="player-core.js"></script>
  <script src="cloud-core.js"></script>
  <script src="gallery-window-core.js"></script>
  <script src="window-lifecycle-core.js"></script>
  <script src="app-core.js"></script>
  <script src="region-core.js"></script>
  <script src="region.js"></script>
</body>
</html>
