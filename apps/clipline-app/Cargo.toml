[package]
name = "clipline-app"
version = "0.1.44"
edition.workspace = true
license.workspace = true

# Tauri (and through it webkit2gtk on Linux) is Windows-gated: capture and
# encode are platform-bound anyway, and ubuntu CI must build without
# system webview libraries. Non-Windows targets get a stub main.
[target.'cfg(windows)'.dependencies]
clipline-capture = { path = "../../crates/clipline-capture" }
clipline-desktop = { path = "../../crates/clipline-desktop" }
clipline-shell = { path = "../../crates/clipline-shell" }
clipline-events = { path = "../../crates/clipline-events" }
clipline-lol = { path = "../../crates/clipline-lol" }
clipline-library = { path = "../../crates/clipline-library" }
clipline-mp4 = { path = "../../crates/clipline-mp4" }
clipline-storage = { path = "../../crates/clipline-storage" }
clipline-settings = { path = "../../crates/clipline-settings" }
clipline-updater = { path = "../../crates/clipline-updater" }
reqwest = { workspace = true, features = ["stream", "multipart"] }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
# Pinned to 2.11.x, not open 2.x: `app.rs` reaches through `PlatformWebview`
# into `ICoreWebView2Controller`, so Tauri's COM types must stay aligned with
# the webview2-com pin below. A routine minor bump could silently change them.
tauri = { version = "~2.11", features = ["tray-icon", "protocol-asset"] }
tauri-runtime = "~2.11"
# Pinned to the version Tauri 2.11 already resolves, so `PlatformWebview::controller`
# hands back the same `ICoreWebView2Controller` type and no second COM binding
# enters the dependency tree.
webview2-com = "0.38"
# Must match the windows-core that webview2-com-sys 0.38 resolves (0.61), or
# `Interface::cast` is called against a different COM type system.
windows-core = "0.61"
chrono = "0.4.45"
rfd = "0.15"
png = "0.17"
base64 = "0.22"
semver = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
rodio = { version = "0.17", default-features = false, features = ["vorbis"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
shiguredo_opus = { workspace = true }
boa_engine = "0.21.1"
clipline-library = { path = "../../crates/clipline-library" }
clipline-test-utils = { path = "../../crates/clipline-test-utils" }
httpmock = { workspace = true }
png = "0.17"
serde_json = { workspace = true }
